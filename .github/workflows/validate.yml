name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m compileall engine scripts tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  remotion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install Node dependencies
        run: npm install
      - name: Typecheck Remotion
        run: npm run typecheck

  render-smoke:
    runs-on: ubuntu-latest
    needs: [python, remotion]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Node dependencies
        run: npm install
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Render smoke test
        run: python scripts/render.py projects/demo.json --out out/ci-smoke.mp4
      - name: Inspect output
        run: ffprobe -v error -show_entries format=duration -show_streams -of json out/ci-smoke.mp4

  production-acceptance:
    runs-on: ubuntu-latest
    needs: [python, remotion]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Node dependencies
        run: npm install
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run production acceptance
        run: python scripts/acceptance.py
      - name: Upload acceptance video
        uses: actions/upload-artifact@v5
        with:
          name: flvyt-production-acceptance
          path: out/acceptance/acceptance.mp4
          if-no-files-found: error

  longform-acceptance:
    runs-on: ubuntu-latest
    needs: [python, remotion]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Node dependencies
        run: npm install
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Render verified TSMC documentary
        run: python scripts/acceptance.py projects/tsmc.generated.json --out out/acceptance/tsmc.mp4
      - name: Upload TSMC video
        uses: actions/upload-artifact@v5
        with:
          name: flvyt-tsmc-longform
          path: out/acceptance/tsmc.mp4
          if-no-files-found: error

  cables-acceptance:
    runs-on: ubuntu-latest
    needs: [python, remotion]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Node dependencies
        run: npm install
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Render verified cables documentary
        run: python scripts/acceptance.py projects/cables.generated.json --out out/acceptance/cables.mp4
      - name: Upload cables video
        uses: actions/upload-artifact@v5
        with:
          name: flvyt-cables-longform
          path: out/acceptance/cables.mp4
          if-no-files-found: error

  fresh-topic-acceptance:
    runs-on: ubuntu-latest
    needs: [python, remotion]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - name: Install Python research + core dependencies
        run: pip install -r requirements-research.txt
      - name: Install Node dependencies
        run: npm install
      - name: Run full fresh-topic pipeline
        run: >-
          python scripts/build.py
          --topic "The Hidden Infrastructure Behind GPS"
          --tts-command "espeak-ng -w {output}"
          --no-auto-captions
          --out out/acceptance/gps-fresh.mp4
      - name: Inspect output
        run: ffprobe -v error -show_entries format=duration,bit_rate -show_entries stream=codec_name,width,height,sample_rate -of json out/acceptance/gps-fresh.mp4
      - name: Upload fresh-topic video
        uses: actions/upload-artifact@v5
        with:
          name: flvyt-fresh-topic
          path: out/acceptance/gps-fresh.mp4
          if-no-files-found: error
